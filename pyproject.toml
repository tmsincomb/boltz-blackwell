[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boltz-blackwell"
version = "0.1.2"
description = "Easy installation and utilities for running Boltz on NVIDIA Blackwell GPUs"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Troy Sincomb", email = "troy.sincomb@example.com" }
]
keywords = [
    "boltz",
    "protein-structure",
    "nvidia",
    "blackwell",
    "gpu",
    "cuda",
    "biomolecular",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
boltz-blackwell = "boltz_blackwell.cli:main"
boltz-blackwell-install = "boltz_blackwell.installer:main"
boltz-blackwell-check = "boltz_blackwell.check:main"
boltz-blackwell-predict = "boltz_blackwell.predict:main"
boltz-blackwell-manifest = "boltz_blackwell.manifest:main"

[project.urls]
Homepage = "https://github.com/tmsincomb/boltz-blackwell"
Repository = "https://github.com/tmsincomb/boltz-blackwell"
Issues = "https://github.com/tmsincomb/boltz-blackwell/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/boltz_blackwell"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "examples/",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
